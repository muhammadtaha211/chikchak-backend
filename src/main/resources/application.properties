# Application Configuration
spring.application.name=ChikChak
server.port=8080

# Active Spring profile.
# Defaults to 'local' so local dev "just works" (loads application-local.properties).
# In production set SPRING_PROFILES_ACTIVE=prod (or any non-local value) — the
# local file is also excluded from the packaged JAR via pom.xml, so even if this
# defaults to 'local' in prod, no local secrets leak.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CC}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Release the DB connection when the @Transactional service method returns instead of holding
# it through JSON rendering. All read paths build DTOs inside @Transactional services, so lazy
# loading still works; this frees pool connections sooner and is the difference between holding
# a connection for the whole request vs. only the query window under heavy polling.
spring.jpa.open-in-view=false
# Batch writes (e.g. status-history / message inserts) into fewer round-trips.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection pool (HikariCP). The default of 10 is the main concurrency wall under polling.
# Tunable per-replica via env so total connections stay under Postgres max_connections:
# (maximum-pool-size * replica_count) + reserve <= max_connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:40}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
# Fail a starved poll in 10s (it just retries on the next interval) instead of hanging 30s.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Embedded Tomcat worker threads. Requests are short and mostly DB-bound, so threads may exceed
# the pool size; the connection pool is the real limiter.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:150}
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200

# JWT Configuration
jwt.secret=${JWT_SECRET}
# Default 604800000 ms = 7 days
jwt.expiration=${JWT_EXPIRATION:604800000}

# Initial admin user (seeded on startup only if both are set and the account doesn't exist)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Request Size Limits (reject oversized / malformed payloads)
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=2MB
# Max JSON/form body for non-multipart write requests (bytes) — 1 MB
request.max-json-bytes=${REQUEST_MAX_JSON_BYTES:1048576}

# Rate Limiting (per client IP)
# Auth routes (login/register/reset-password): strict brute-force protection
ratelimit.auth.capacity=${RATELIMIT_AUTH_CAPACITY:5}
ratelimit.auth.window-minutes=${RATELIMIT_AUTH_WINDOW_MINUTES:15}
# State-changing writes (POST/PUT/DELETE/PATCH): generous, reads are never throttled
ratelimit.write.capacity=${RATELIMIT_WRITE_CAPACITY:60}
ratelimit.write.window-minutes=${RATELIMIT_WRITE_WINDOW_MINUTES:1}

# CORS / WebSocket Allowed Origins (comma-separated)
websocket.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ChikChak Business Configuration
chikchak.service-fee=20
chikchak.currency=ILS
chikchak.max-distance-km=50
chikchak.base-distance-rate=2.5

# Logging
logging.level.com.chikchak=DEBUG
logging.level.org.springframework.security=DEBUG
