# Application Configuration
spring.application.name=ChikChak
server.port=8080

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:chikchak
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=ChikChakSuperSecretKeyForJWTTokenGeneration2024!
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WebSocket Configuration
websocket.allowed-origins=http://localhost:3000,https://your-frontend-domain.com

# Email Configuration (configure with your provider)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ChikChak Business Configuration
chikchak.service-fee=20
chikchak.currency=ILS
chikchak.max-distance-km=50
chikchak.base-distance-rate=2.5

# Logging
logging.level.com.chikchak=DEBUG
logging.level.org.springframework.security=DEBUG