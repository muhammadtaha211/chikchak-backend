# Production profile overrides (active only when SPRING_PROFILES_ACTIVE=prod).
# Quiets the noisy base defaults; base application.properties keeps DEBUG/show-sql for local dev.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.chikchak=INFO
logging.level.org.springframework.security=WARN
logging.level.root=INFO
