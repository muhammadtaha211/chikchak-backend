# Production profile overrides (active only when SPRING_PROFILES_ACTIVE=prod).
# Quiets the noisy base defaults; base application.properties keeps DEBUG/show-sql for local dev.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.chikchak=INFO
logging.level.org.springframework.security=WARN
logging.level.root=INFO

# Hibernate must not auto-mutate the production schema. Override DDL_AUTO=update only
# for an initial migration if the schema isn't managed separately.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Do not expose API docs / Swagger UI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# H2 console must never be enabled in production
spring.h2.console.enabled=false
